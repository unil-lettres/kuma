networks:
  kuma-net:
    driver: bridge

name: kuma

services:
  kuma-app:
    image: louislam/uptime-kuma:beta
    depends_on:
      kuma-mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3001 || exit 1" ]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 2m
    env_file:
      - .env
    volumes:
      - app-data:/app/data
    ports:
      - "127.0.0.1:8383:3001"
    networks:
      - kuma-net
    container_name: kuma-app
  kuma-mysql:
    image: mariadb:11.4
    ports:
      - "127.0.0.1:3312:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - kuma-net
    container_name: kuma-mysql

volumes:
  mysql-data:
  app-data:
